<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebSocket 扑克游戏客户端</title>
    <!-- 引入STOMP和SockJS的JS库（CDN） -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #messages { margin-top: 20px; padding: 10px; border: 1px solid #ccc; height: 200px; overflow-y: auto; }
        .control-group { margin: 15px 0; padding: 10px; border: 1px solid #eee; border-radius: 5px; }
        .action-btn { margin: 0 5px; padding: 8px 15px; cursor: pointer; }
        .amount-input { margin-left: 10px; padding: 5px; width: 80px; }
        .room-input { padding: 5px; width: 100px; margin-right: 10px; }
        button:disabled { cursor: not-allowed; opacity: 0.6; }
    </style>
</head>
<body>
<div>
    <h1>扑克游戏 WebSocket 客户端</h1>

    <!-- 房间号设置区域 -->
    <div class="control-group">
        <label>房间号：</label>
        <input type="text" id="roomIdInput" placeholder="输入房间号" class="room-input">
        <button onclick="setRoomId()" class="action-btn">确认房间号</button>
        <span id="roomStatus" style="color: #666; margin-left: 10px;">未设置房间号</span>
    </div>

    <!-- 操作按钮区域 -->
    <div class="control-group">
        <label>游戏操作：</label>
        <button onclick="selectAction('call')" class="action-btn">CALL</button>
        <button onclick="selectAction('check')" class="action-btn">CHECK</button>
        <button onclick="selectAction('fold')" class="action-btn">FOLD</button>
        <button onclick="selectAction('raise')" class="action-btn">RAISE</button>

        <!-- 金额输入框（仅RAISE时启用） -->
        <label for="amountInput" style="margin-left: 10px;">金额：</label>
        <input type="number" id="amountInput" placeholder="输入金额" class="amount-input" disabled>
        <button onclick="sendGameAction()" class="action-btn" disabled>发送操作</button>
    </div>

    <!-- 消息展示区域 -->
    <div id="messages"></div>
</div>

<script>
    var stompClient = null;
    var currentRoomId = null; // 当前房间号
    var currentAction = null; // 当前选中的操作
    var subscription = null;  // 订阅对象，用于取消旧订阅

    // 初始化WebSocket连接
    function connect() {
        // 创建SockJS连接，指向服务端的/ws端点
        var socket = new SockJS('/ws');
        // 创建STOMP客户端
        stompClient = Stomp.over(socket);
        // 连接WebSocket
        stompClient.connect({}, function(frame) {
            console.log('WebSocket连接成功: ' + frame);
            showMessage('WebSocket已连接，请设置房间号并选择操作');
        }, function(error) {
            // 连接失败回调
            console.error('WebSocket连接失败: ' + error);
            alert('WebSocket连接失败，请检查服务端是否启动');
        });
    }

    // 设置房间号并订阅对应主题
    function setRoomId() {
        var roomInput = document.getElementById('roomIdInput');
        var roomId = roomInput.value.trim();

        if (!roomId) {
            alert('请输入有效的房间号！');
            return;
        }

        // 取消旧的订阅
        if (subscription) {
            subscription.unsubscribe();
            console.log('取消旧房间[' + currentRoomId + ']的订阅');
        }

        // 更新当前房间号
        currentRoomId = roomId;
        document.getElementById('roomStatus').textContent = '当前房间：' + roomId;
        document.getElementById('roomStatus').style.color = '#28a745';

        // 订阅新房间的消息
        if (stompClient && stompClient.connected) {
            var subscribePath = '/topic/game/' + currentRoomId;
            subscription = stompClient.subscribe(subscribePath, function(greeting) {
                // 解析消息并显示
                try {
                    var message = JSON.parse(greeting.body);
                    showMessage('收到房间[' + currentRoomId + ']消息：' + JSON.stringify(message));
                } catch (e) {
                    showMessage('收到房间[' + currentRoomId + ']消息：' + greeting.body);
                }
            });
            showMessage('已订阅房间[' + currentRoomId + ']的消息');

            // 启用操作按钮
            document.querySelector('button[onclick="sendGameAction()"]').disabled = false;
        } else {
            alert('WebSocket未连接，请刷新页面重试！');
        }
    }

    // 选择游戏操作
    function selectAction(action) {
        currentAction = action;
        var amountInput = document.getElementById('amountInput');

        // 只有RAISE操作需要输入金额
        if (action === 'raise') {
            amountInput.disabled = false;
            amountInput.setAttribute('required', 'required');
        } else {
            amountInput.disabled = true;
            amountInput.removeAttribute('required');
            amountInput.value = ''; // 清空金额
        }

        // 高亮选中的按钮（可选）
        document.querySelectorAll('.action-btn').forEach(btn => {
            if (btn.textContent.toLowerCase() === action) {
                btn.style.backgroundColor = '#007bff';
                btn.style.color = 'white';
            } else if (!btn.onclick || !btn.onclick.toString().includes('sendGameAction')) {
                btn.style.backgroundColor = '';
                btn.style.color = '';
            }
        });
    }

    // 发送游戏操作消息
    function sendGameAction() {
        // 验证前置条件
        if (!stompClient || !stompClient.connected) {
            alert('WebSocket未连接！');
            return;
        }

        if (!currentRoomId) {
            alert('请先设置房间号！');
            return;
        }

        if (!currentAction) {
            alert('请先选择游戏操作！');
            return;
        }

        // 构造消息体
        var gameMessage = {
            playerId: "1001", // 固定玩家ID
            action: currentAction,
            amount: 0 // 默认金额
        };

        // RAISE操作时获取金额
        if (currentAction === 'raise') {
            var amount = document.getElementById('amountInput').value.trim();
            if (!amount || isNaN(amount) || Number(amount) <= 0) {
                alert('RAISE操作请输入有效的金额！');
                return;
            }
            gameMessage.amount = Number(amount);
        }

        // 发送消息到对应房间
        var sendPath = '/app/game/' + currentRoomId + '/action';
        try {
            stompClient.send(sendPath, {}, JSON.stringify(gameMessage));
            showMessage('发送操作成功：' + JSON.stringify(gameMessage));

            // 重置选中状态（可选）
            if (currentAction !== 'raise') {
                currentAction = null;
                document.querySelectorAll('.action-btn').forEach(btn => {
                    if (!btn.onclick || !btn.onclick.toString().includes('sendGameAction')) {
                        btn.style.backgroundColor = '';
                        btn.style.color = '';
                    }
                });
            }
        } catch (e) {
            console.error('发送消息失败：', e);
            alert('发送操作失败，请重试！');
        }
    }

    // 显示消息到页面
    function showMessage(message) {
        var messagesDiv = document.getElementById('messages');
        var p = document.createElement('p');
        p.textContent = new Date().toLocaleTimeString() + ' - ' + message;
        messagesDiv.appendChild(p);
        // 滚动到最新消息
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // 页面加载完成后自动连接WebSocket
    window.onload = function() {
        connect();
    };
</script>
</body>
</html>
