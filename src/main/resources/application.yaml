spring:
  application:
    name: DPoker
  # 本地开发默认激活 dev profile，部署时通过 --spring.profiles.active=prod 切换
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
# 业务自定义配置
dpoker:
  register-code: dpoker616   # 注册码，修改此处即可更换

# MyBatisPlus 公共配置
mybatis-plus:
  type-aliases-package: com.example.dpoker.entity  # 实体类所在包名
