spring:
  application:
    name: DPoker
  # 本地开发默认激活 dev profile，部署时通过 --spring.profiles.active=prod 切换
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
# MyBatisPlus 公共配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL日志
  type-aliases-package: com.example.dpoker.entity  # 实体类所在包名
