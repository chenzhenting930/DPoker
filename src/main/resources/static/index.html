<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <title>SockJS + STOMP 登录验证</title>
    <style>
        body{font-family:Arial;margin:20px}pre{background:#f5f5f5;padding:10px}
    </style>
</head>
<body>
<h3>SockJS + STOMP 登录演示</h3>
<button id="btnConn">连接并登录</button>
<button id="btnDis" disabled>断开</button>
<pre id="log"></pre>

<!-- 1. 引入 SockJS 与 STOMP -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    const log = txt => document.querySelector('#log').textContent += txt + '\n';
    let stomp = null;

    document.querySelector('#btnConn').onclick = () => {
        /* 2. SockJS 兼容地址（后端开了 .withSockJS()） */
        const sock = new SockJS('http://localhost:8080/ws');
        stomp = Stomp.over(sock);
        stomp.debug = str => log('[DEBUG] ' + str);   // 想看帧就留，不想看就删

        stomp.connect(
            {},                                    // header
            frame => {                             // 成功
                log('🔗 STOMP 连接成功');
                document.querySelector('#btnConn').disabled = true;
                document.querySelector('#btnDis').disabled = false;

                // 3. 订阅“只给我”的登录回包
                stomp.subscribe('/user/queue/login', message => {
                    const resp = JSON.parse(message.body);
                    log('📩 收到登录回包：' + JSON.stringify(resp, null, 2));
                });

                // 4. 发送登录
                stomp.send('/app/login', {}, JSON.stringify({
                    type: 'LOGIN',
                    payload: {
                        username: 'Player' + Math.floor(Math.random() * 1000),
                        avatar: 'avatar_01'
                    }
                }));
                log('➡️ 已发送 LOGIN 消息');
            },
            err => {                                // 失败
                log('❌ 连接/协议错误：' + err);
            }
        );
    };

    document.querySelector('#btnDis').onclick = () => {
        if (stomp && stomp.connected) {
            stomp.disconnect(() => {
                log('👋 已断开');
                document.querySelector('#btnConn').disabled = false;
                document.querySelector('#btnDis').disabled = true;
            });
        }
    };
</script>
</body>
</html>
